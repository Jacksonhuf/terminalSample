name: prototype
version: "1.0"
description: 样机管理领域本体

object_types:
  - name: Prototype
    display_name: 样机
    description: 物理样机设备
    primary_key: id
    properties:
      - name: id
        type: string
        required: true
        description: 样机唯一标识
      - name: serial_number
        type: string
        required: true
        description: 序列号
      - name: model
        type: string
        required: true
        description: 型号
      - name: status
        type: enum
        enum_values: [available, reserved, in_use, maintenance, retired]
        required: true
        description: 当前状态
      - name: firmware_version
        type: string
        description: 固件版本

  - name: Person
    display_name: 人员
    description: 组织成员
    primary_key: id
    properties:
      - name: id
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: department
        type: string
      - name: email
        type: string
        description: 工作邮箱（邮件通知）
      - name: im_user_id
        type: string
        description: 内部 IM 工号/用户名（聊天通知）

  - name: Project
    display_name: 项目
    description: 研发项目
    primary_key: id
    properties:
      - name: id
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: status
        type: enum
        enum_values: [active, completed, archived]

  - name: Location
    display_name: 库位
    description: 存放位置
    primary_key: id
    properties:
      - name: id
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: building
        type: string

links:
  - name: belongs_to
    source_type: Prototype
    target_type: Project
    cardinality: many
    description: 样机归属项目

  - name: custodian
    source_type: Prototype
    target_type: Person
    cardinality: one
    description: 当前保管人

  - name: located_at
    source_type: Prototype
    target_type: Location
    cardinality: one
    description: 样机存放位置

actions:
  - name: ReservePrototype
    display_name: 预约样机
    description: 预约一台可用样机
    target_type: Prototype
    requires_approval: true
    allowed_roles: [operator, admin]
    approver_roles: [admin]
    keywords: [预约, reserve, 预订]
    parameters:
      - name: person_id
        type: string
        required: true
        description: 预约人 ID
      - name: start_date
        type: string
        required: true
        description: 开始日期 (YYYY-MM-DD)
      - name: end_date
        type: string
        required: true
        description: 结束日期 (YYYY-MM-DD)

  - name: CheckoutPrototype
    display_name: 领用样机
    description: 领用样机出库
    target_type: Prototype
    requires_approval: true
    allowed_roles: [operator, admin]
    approver_roles: [admin]
    keywords: [领用, checkout, 借出, 领取]
    parameters:
      - name: person_id
        type: string
        required: true
        description: 领用人 ID

  - name: ReturnPrototype
    display_name: 归还样机
    description: 归还样机入库
    target_type: Prototype
    requires_approval: false
    allowed_roles: [operator, admin]
    keywords: [归还, return, 还回]
    parameters:
      - name: condition
        type: string
        required: true
        description: 归还状态 (good/damaged)

  - name: RetirePrototype
    display_name: 报废样机
    description: 将样机标记为报废
    target_type: Prototype
    requires_approval: true
    allowed_roles: [admin]
    approver_roles: [admin]
    keywords: [报废, retire, 退役]
    parameters:
      - name: reason
        type: string
        required: true
        description: 报废原因

  - name: NotifyCustodian
    display_name: 通知保管人
    description: 通过内部 IM 通知样机当前保管人
    target_type: Prototype
    requires_approval: false
    allowed_roles: [operator, admin]
    keywords: [通知, 聊天, 保管人, notify]
    parameters:
      - name: extra_message
        type: string
        required: false
        description: 附加说明

  - name: SendChatMessage
    display_name: 发送聊天消息
    description: 就某样机向指定人员发送 IM 消息
    target_type: Prototype
    requires_approval: true
    allowed_roles: [operator, admin]
    approver_roles: [admin]
    keywords: [发消息, 聊天, chat]
    parameters:
      - name: person_id
        type: string
        required: true
        description: 接收人 Person ID
      - name: message
        type: string
        required: true
        description: 消息正文

  - name: SendEmailReminder
    display_name: 发送邮件跟催
    description: 立即发送邮件跟催
    target_type: Prototype
    requires_approval: true
    allowed_roles: [operator, admin]
    approver_roles: [admin]
    keywords: [邮件, 跟催, email, reminder]
    parameters:
      - name: person_id
        type: string
        required: true
        description: 收件人 Person ID
      - name: reason
        type: string
        required: true
        description: 跟催事由
      - name: due_date
        type: string
        required: false
        description: 截止日期 (YYYY-MM-DD)

  - name: ScheduleReminder
    display_name: 预约跟催
    description: 在指定时间发送跟催（邮件或 IM）
    target_type: Prototype
    requires_approval: false
    allowed_roles: [operator, admin]
    keywords: [预约跟催, 定时, schedule]
    parameters:
      - name: person_id
        type: string
        required: true
        description: 收件人 Person ID
      - name: channel
        type: string
        required: false
        description: chat 或 email，默认 email
      - name: reason
        type: string
        required: true
        description: 跟催事由
      - name: due_at
        type: string
        required: true
        description: 发送时间 ISO8601 或 YYYY-MM-DD
