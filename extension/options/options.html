<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Browser Adapter Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 16px; }
    .saved { color: #15803d; margin-top: 12px; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Browser Action Adapter</h1>
  <p class="hint">通用浏览器执行端 — 可被任意智能体通过 /v1/browser API 驱动</p>
  <label for="bridgeUrl">Bridge / Admin 地址</label>
  <input id="bridgeUrl" placeholder="http://127.0.0.1:8080" />
  <label for="apiVersion">API 版本</label>
  <select id="apiVersion">
    <option value="v1">v1 — /v1/browser/sessions（推荐）</option>
    <option value="legacy">legacy — /api/browser/runs</option>
  </select>
  <label for="pollIntervalSec">轮询间隔（秒）</label>
  <input id="pollIntervalSec" type="number" min="3" max="120" />
  <label><input type="checkbox" id="enabled" /> 启用自动轮询</label>
  <button id="save">保存</button>
  <div id="msg" class="saved"></div>
  <script src="options.js"></script>
</body>
</html>
