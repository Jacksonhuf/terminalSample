[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology-agent-platform"
version = "0.1.0"
description = "Minimal ontology-based agent platform with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
chat = [
    "chainlit>=2.0.0",
]

[project.scripts]
ontology-platform = "ontology_platform.cli:main"
ontology-admin = "ontology_platform.admin.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_platform"]

[tool.hatch.build.targets.wheel.force-include]
"src/ontology_platform/admin/static" = "ontology_platform/admin/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
