[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology-agent-platform"
version = "0.1.0"
description = "Minimal ontology-based agent platform with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.0",
    "chainlit>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
chat = [
    "chainlit>=2.0.0",
]
studio = [
    "langgraph-cli[inmem]>=0.2.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
checkpoint = [
    "langgraph-checkpoint-sqlite>=2.0.0",
]
capture = [
    "playwright>=1.40.0",
]
browser-bridge = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
browser-client = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
]
browser = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ontology-platform = "ontology_platform.cli:main"
ontology-admin = "ontology_platform.admin.__main__:main"
ontology-connector = "ontology_platform.connector.cli:main"
ontology-outreach = "ontology_platform.integrations.cli:main"
ontology-browser-bridge = "ontology_platform.browser_adapter.__main__:main"
ontology-browser-client = "ontology_platform.browser_adapter.cli_client:main"
ontology-browser-skill = "ontology_platform.browser_adapter.cli_skill:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_platform"]

[tool.hatch.build.targets.wheel.force-include]
"src/ontology_platform/admin/static" = "ontology_platform/admin/static"
"src/ontology_platform/integrations/templates" = "ontology_platform/integrations/templates"
"skills/ontology-browser" = "ontology_platform/browser_adapter/skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
