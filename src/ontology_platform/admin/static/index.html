<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontology Admin - 本体管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <span>◈</span> Ontology Admin
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-btn active">本体列表</a>
      <a href="/editor" class="nav-btn">编辑器</a>
      <a href="/visualize" class="nav-btn">可视化</a>
      <a href="/operations" class="nav-btn">运营中心</a>
      <a href="/connectors" class="nav-btn">数据连接</a>
      <a href="/mappings" class="nav-btn">数据映射</a>
      <a href="/settings/llm" class="nav-btn">LLM 配置</a>
    </nav>
  </header>

  <div class="container">
    <div class="toolbar">
      <div>
        <h1 class="page-title">本体管理</h1>
        <p class="page-subtitle" id="dir-info">加载中...</p>
      </div>
      <button class="btn btn-primary" onclick="showCreateModal()">+ 新建本体</button>
    </div>

    <div class="card-grid" id="ontology-list"></div>
  </div>

  <!-- Create Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <h2>新建本体</h2>
      <div class="form-group">
        <label>名称 (英文标识)</label>
        <input id="new-name" placeholder="my_ontology">
      </div>
      <div class="form-group">
        <label>描述</label>
        <input id="new-desc" placeholder="本体描述">
      </div>
      <div class="form-group">
        <label>版本</label>
        <input id="new-version" value="1.0">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="hideCreateModal()">取消</button>
        <button class="btn btn-primary" onclick="createOntology()">创建</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    async function loadOntologies() {
      try {
        const data = await api('/ontologies');
        document.getElementById('dir-info').textContent = `目录: ${data.directory}`;
        const list = document.getElementById('ontology-list');

        if (!data.ontologies.length) {
          list.innerHTML = `<div class="empty-state card" style="grid-column:1/-1">
            <h3>暂无本体</h3>
            <p>点击「新建本体」开始定义你的第一个 Ontology</p>
          </div>`;
          return;
        }

        list.innerHTML = data.ontologies.map(o => `
          <div class="card ontology-card" onclick="openOntology('${o.name}')">
            <h3>${escHtml(o.name)} <span class="badge badge-blue">v${escHtml(o.version)}</span></h3>
            <p>${escHtml(o.description || '无描述')}</p>
            <div class="stats">
              <span class="stat"><strong>${o.object_type_count}</strong> 对象类型</span>
              <span class="stat"><strong>${o.link_count}</strong> 关系</span>
              <span class="stat"><strong>${o.action_count}</strong> 动作</span>
            </div>
            <div style="margin-top:12px;display:flex;gap:8px">
              <a href="/editor?name=${o.name}" class="btn btn-secondary btn-sm" onclick="event.stopPropagation()">编辑</a>
              <a href="/visualize?name=${o.name}" class="btn btn-secondary btn-sm" onclick="event.stopPropagation()">可视化</a>
            </div>
          </div>
        `).join('');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function openOntology(name) {
      window.location.href = `/editor?name=${name}`;
    }

    function showCreateModal() {
      document.getElementById('create-modal').classList.add('open');
    }

    function hideCreateModal() {
      document.getElementById('create-modal').classList.remove('open');
    }

    async function createOntology() {
      const name = document.getElementById('new-name').value.trim();
      if (!name) return toast('请输入名称', 'error');
      try {
        await api('/ontologies', {
          method: 'POST',
          body: JSON.stringify({
            name,
            description: document.getElementById('new-desc').value,
            version: document.getElementById('new-version').value || '1.0',
          }),
        });
        hideCreateModal();
        toast('本体创建成功');
        window.location.href = `/editor?name=${name}`;
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    loadOntologies();
  </script>
</body>
</html>
