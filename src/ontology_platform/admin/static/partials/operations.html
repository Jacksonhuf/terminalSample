<div class="container">
    <div class="toolbar">
      <div>
        <h1 class="page-title">运营中心</h1>
        <p class="page-subtitle" id="status-info">平台治理能力：审批、审计、出站消息与跟催（与具体业务应用解耦）</p>
      </div>
      <button class="btn btn-primary" id="run-outreach-btn" onclick="runOutreach()">▶ 执行到期跟催</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="overview" onclick="switchTab('overview')">平台概览</button>
      <button class="tab" data-tab="approvals" onclick="switchTab('approvals')">审批工作台</button>
      <button class="tab" data-tab="audit" onclick="switchTab('audit')">审计日志</button>
      <button class="tab" data-tab="messages" onclick="switchTab('messages')">消息记录</button>
      <button class="tab" data-tab="outreach" onclick="switchTab('outreach')">跟催任务</button>
    </div>

    <div id="panel-overview" class="tab-panel active">
      <div class="filter-bar">
        <button class="btn btn-secondary btn-sm" onclick="loadOverview()">刷新</button>
      </div>
      <div id="overview-content"></div>
    </div>

    <div id="panel-audit" class="tab-panel">
