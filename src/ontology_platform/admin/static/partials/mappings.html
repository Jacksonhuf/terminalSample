<div class="container">
    <div class="toolbar">
      <div>
        <h1 class="page-title">数据映射工作台</h1>
        <p class="page-subtitle">管理集成暂存数据到 Ontology 的映射配置，预览后同步</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="discover" onclick="switchTab('discover')">数据源浏览</button>
      <button class="tab" data-tab="configure" onclick="switchTab('configure')">映射配置</button>
      <button class="tab" data-tab="sync" onclick="switchTab('sync')">同步任务</button>
    </div>

    <div id="panel-discover" class="tab-panel active">
      <div class="filter-bar">
        <button class="btn btn-secondary btn-sm" onclick="loadStaging()">刷新</button>
      </div>
      <div class="table-wrap" id="staging-table"></div>
    </div>

    <div id="panel-configure" class="tab-panel">
      <div class="filter-bar">
        <button class="btn btn-primary btn-sm" onclick="showProfileForm()">+ 新建映射</button>
        <button class="btn btn-secondary btn-sm" onclick="loadProfiles()">刷新</button>
      </div>
      <div class="card" id="profile-form" style="display:none; margin-bottom:16px">
        <h3 class="section-title" id="profile-form-title">编辑映射</h3>
        <div class="form-grid">
          <label>名称<input id="p-name" placeholder="ERP样机 → Prototype"></label>
          <label>状态
            <select id="p-status"><option value="draft">draft</option><option value="active">active</option></select>
          </label>
          <label>连接器
            <select id="p-connector" onchange="onConnectorChange()"></select>
          </label>
          <label>记录类型<input id="p-record-type" placeholder="prototype"></label>
          <label>目标本体
            <select id="p-ontology" onchange="loadObjectTypes()"><option value="prototype">prototype</option></select>
          </label>
          <label>目标对象类型
            <select id="p-object-type" onchange="renderFieldRules()"></select>
          </label>
          <label>源主键字段<input id="p-source-id" value="id"></label>
          <label>目标主键属性<input id="p-id-field" value="id"></label>
        </div>
        <div style="margin-top:16px">
          <h4 class="section-subtitle">字段映射</h4>
          <div id="field-rules"></div>
          <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="addFieldRule()">+ 添加字段</button>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="saveProfile()">保存</button>
          <button class="btn btn-secondary btn-sm" onclick="hideProfileForm()">取消</button>
          <button class="btn btn-secondary btn-sm" id="preview-btn" onclick="previewProfile()">试跑预览</button>
        </div>
        <pre id="preview-output" class="code-block" style="display:none; margin-top:12px"></pre>
      </div>
      <div class="table-wrap" id="profiles-table"></div>
    </div>

    <div id="panel-sync" class="tab-panel">
      <div class="filter-bar">
        <button class="btn btn-secondary btn-sm" onclick="loadSyncRuns()">刷新</button>
      </div>
      <p class="hint">仅 <code>active</code> 状态的映射可执行同步。需要启动 Admin 时配置 <code>--store-path</code>。</p>
      <div class="table-wrap" id="sync-runs-table"></div>
    </div>
  </div>
