<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontology Platform Admin</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js" defer></script>
</head>
<body class="app-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <span>◈</span> Ontology Platform
    </div>
    <div class="topbar-actions">
      <span class="topbar-status" id="global-status">加载中...</span>
      <a href="http://localhost:8000" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">打开对话 ↗</a>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="page-root" class="page-root"></div>
    </main>
  </div>

  <script src="/static/app.js"></script>
  <script type="module" src="/static/shell.js"></script>
</body>
</html>
